name: Build and Push Docker Image

# Build automatico de la imagen Docker para el deployment K8s de AppToLast.
# Trigger en push a apptolast branch O manual via workflow_dispatch.
# Push a GHCR (ghcr.io/apptolast/tenacitos) usando GITHUB_TOKEN (no requiere secrets adicionales).

on:
  push:
    branches:
      - apptolast
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Tag suffix opcional (ej: -hotfix1)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: apptolast/tenacitos

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:apptolast
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:apptolast-${{ steps.vars.outputs.sha_short }}${{ github.event.inputs.tag_suffix }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/apptolast/tenacitOS
            org.opencontainers.image.description=TenacitOS adapted for AppToLast K8s deployment (sidecar of openclaw pod)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image summary
        run: |
          echo "## Build successful 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image pushed to GHCR:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:apptolast\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:apptolast-${{ steps.vars.outputs.sha_short }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Para pull desde el cluster K8s:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "kubectl set image -n openclaw deploy/openclaw tenacitos=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:apptolast-${{ steps.vars.outputs.sha_short }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
